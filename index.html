<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Weiterleitung</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px system-ui,sans-serif;background:#fafafa;color:#555}@media(prefers-color-scheme:dark){body{background:#111;color:#aaa}}a{color:inherit}</style>
</head>
<body>
<p id="m">Weiterleitung …</p>
<script>
// Öffentlicher OAuth-Rücksprung: reicht nur code/state/error an den privaten
// Callback im Tailnet weiter. Keine Daten, kein Tracking, kein Speicher.
(function () {
  var TARGET = "https://jps-server.tail8602fe.ts.net:8450/api/withings/callback";
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ["code", "state", "error"].forEach(function (k) { if (q.has(k)) out.set(k, q.get(k)); });
  if (!out.has("state")) { document.getElementById("m").textContent = "Nichts weiterzuleiten."; return; }
  location.replace(TARGET + "?" + out.toString());
})();
</script>
</body>
</html>
